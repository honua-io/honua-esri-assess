name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests --ignore=tests/smoke
      - run: ruff check
      - run: mypy
      - run: python scripts/check_dep_licenses.py

  smoke:
    name: fixture-backed smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[smoke]"
      - run: pytest tests/smoke -v --durations=10

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ".commitlintrc.json"
