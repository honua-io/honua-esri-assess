name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests --ignore=tests/smoke
      - run: ruff check
      - run: mypy
      - run: python scripts/check_dep_licenses.py

  python-package:
    name: Python package, audit, and smoke install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Audit Python dependencies
        run: |
          python scripts/python_runtime_requirements.py > "$RUNNER_TEMP/python-runtime.txt"
          python -m pip_audit --strict --requirement "$RUNNER_TEMP/python-runtime.txt"
      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build wheel and source distribution
        run: python -m build --outdir "$RUNNER_TEMP/python-dist"
      - name: Validate Python distribution metadata and contents
        run: python scripts/validate_python_dist.py "$RUNNER_TEMP/python-dist"
      - name: Smoke-install wheel
        run: |
          python -m venv "$RUNNER_TEMP/python-smoke"
          "$RUNNER_TEMP/python-smoke/bin/pip" install "$RUNNER_TEMP/python-dist"/*.whl
          "$RUNNER_TEMP/python-smoke/bin/pip" check
          "$RUNNER_TEMP/python-smoke/bin/honua-migrate" --help
          "$RUNNER_TEMP/python-smoke/bin/honua-esri-assess" --help
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ github.sha }}
          path: ${{ runner.temp }}/python-dist/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: fixture-backed smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[smoke]"
      - run: pytest tests/smoke -v --durations=10

  javascript:
    name: JavaScript package gate (Node 24 LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Detect JavaScript package
        id: package
        run: python scripts/runtime_package.py detect javascript >> "$GITHUB_OUTPUT"
      - name: Report absent package
        if: steps.package.outputs.present == 'false'
        run: echo "packages/javascript contains markers only; JavaScript gate is dormant."
      - uses: actions/setup-node@v6
        if: steps.package.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - name: Install locked dependencies
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: npm ci
      - name: Build
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: npm run build
      - name: Test
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: npm test
      - name: Lint
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: npm run lint
      - name: Audit dependencies
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: npm audit --audit-level=high
      - name: Check dependency licenses
        if: steps.package.outputs.present == 'true'
        run: python scripts/check_runtime_licenses.py javascript
      - name: Pack reproducible npm artifact
        if: steps.package.outputs.present == 'true'
        working-directory: packages/javascript
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p "$RUNNER_TEMP/javascript-dist"
          npm pack --pack-destination "$RUNNER_TEMP/javascript-dist"
      - name: Smoke-install npm artifact
        if: steps.package.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/javascript-smoke"
          cd "$RUNNER_TEMP/javascript-smoke"
          npm init --yes
          npm install --ignore-scripts "$RUNNER_TEMP/javascript-dist"/*.tgz
          PACKAGE_NAME=$(node -p "require('$GITHUB_WORKSPACE/packages/javascript/package.json').name")
          BIN_NAME=$(node -p "Object.keys(require('./node_modules/' + '$PACKAGE_NAME' + '/package.json').bin)[0]")
          "$RUNNER_TEMP/javascript-smoke/node_modules/.bin/$BIN_NAME" matrix \
            --report "$RUNNER_TEMP/javascript-smoke/matrix.json"
          test -s "$RUNNER_TEMP/javascript-smoke/matrix.json"
      - uses: actions/upload-artifact@v7
        if: steps.package.outputs.present == 'true'
        with:
          name: javascript-dist-${{ github.sha }}
          path: ${{ runner.temp }}/javascript-dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  dotnet:
    name: MAUI tool package gate (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Detect MAUI package
        id: package
        run: python scripts/runtime_package.py detect maui >> "$GITHUB_OUTPUT"
      - name: Report absent package
        if: steps.package.outputs.present == 'false'
        run: echo "packages/maui contains markers only; .NET gate is dormant."
      - uses: actions/setup-dotnet@v5
        if: steps.package.outputs.present == 'true'
        with:
          dotnet-version: "10.0.x"
      - name: Read dotnet tool metadata
        if: steps.package.outputs.present == 'true'
        id: tool
        run: python scripts/runtime_package.py dotnet-tool-metadata >> "$GITHUB_OUTPUT"
      - name: Restore with NuGet audit
        if: steps.package.outputs.present == 'true'
        run: |
          while IFS= read -r project; do
            dotnet restore "$project" \
              -p:NuGetAudit=true \
              -p:NuGetAuditMode=all \
              -p:NuGetAuditLevel=moderate \
              -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
          done < <(find packages/maui -name '*.csproj' -type f -print | sort)
      - name: Build
        if: steps.package.outputs.present == 'true'
        run: |
          while IFS= read -r project; do
            dotnet build "$project" --configuration Release --no-restore \
              -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          done < <(find packages/maui -name '*.csproj' -type f -print | sort)
      - name: Test
        if: steps.package.outputs.present == 'true'
        run: |
          mapfile -t test_projects < <(find packages/maui -iname '*test*.csproj' -type f -print | sort)
          test "${#test_projects[@]}" -gt 0
          for project in "${test_projects[@]}"; do
            dotnet test "$project" --configuration Release --no-restore --no-build
          done
      - name: Format
        if: steps.package.outputs.present == 'true'
        run: |
          while IFS= read -r project; do
            dotnet format "$project" --verify-no-changes --no-restore
          done < <(find packages/maui -name '*.csproj' -type f -print | sort)
      - name: Check dependency licenses
        if: steps.package.outputs.present == 'true'
        run: python scripts/check_runtime_licenses.py maui
      - name: Pack deterministic dotnet tool
        if: steps.package.outputs.present == 'true'
        run: >-
          dotnet pack "${{ steps.tool.outputs.project }}" --configuration Release
          --no-restore --output "$RUNNER_TEMP/maui-dist"
          -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          -p:RepositoryCommit=${{ github.sha }}
      - name: Smoke-install dotnet tool
        if: steps.package.outputs.present == 'true'
        run: |
          dotnet tool install "${{ steps.tool.outputs.package_id }}" \
            --tool-path "$RUNNER_TEMP/maui-smoke" \
            --add-source "$RUNNER_TEMP/maui-dist" \
            --version "${{ steps.tool.outputs.version }}"
          "$RUNNER_TEMP/maui-smoke/${{ steps.tool.outputs.command }}" --help
      - uses: actions/upload-artifact@v7
        if: steps.package.outputs.present == 'true'
        with:
          name: maui-dist-${{ github.sha }}
          path: ${{ runner.temp }}/maui-dist/*.nupkg
          if-no-files-found: error
          retention-days: 14

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ".commitlintrc.json"
