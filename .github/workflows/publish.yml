name: Publish

on:
  push:
    branches:
      - trunk
    tags:
      - "honua-esri-assess-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test without publishing to PyPI."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  branch-noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publish workflow is a no-op for trunk pushes."

  pre-publish-typecheck:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/honua-esri-assess-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: mypy

  validate-tag:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/honua-esri-assess-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate release tag
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: python scripts/validate_publish_tag.py "${GITHUB_REF_NAME}"
      - name: Allow dry-run dispatch without a tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: python scripts/validate_publish_tag.py --allow-untagged

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/honua-esri-assess-v') }}
    runs-on: ubuntu-latest
    needs:
      - pre-publish-typecheck
      - validate-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: hatch build --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: honua-esri-assess-dist
          path: dist/*
          retention-days: 14

  smoke-install:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/honua-esri-assess-v') }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: honua-esri-assess-dist
          path: ${{ runner.temp }}/dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare isolated smoke workspace
        run: |
          SMOKE_DIR="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$SMOKE_DIR/tests"
          cp -R tests/smoke "$SMOKE_DIR/tests/smoke"
          cp -R schemas "$SMOKE_DIR/schemas"
      - run: python -m venv "$RUNNER_TEMP/wheel-smoke/.smoke"
      - run: |
          "$RUNNER_TEMP/wheel-smoke/.smoke/bin/pip" install "$RUNNER_TEMP/dist"/*.whl "pytest>=8,<9" "responses>=0.25"
      - run: |
          "$RUNNER_TEMP/wheel-smoke/.smoke/bin/pytest" "$RUNNER_TEMP/wheel-smoke/tests/smoke" -q
      - run: >
          "$RUNNER_TEMP/wheel-smoke/.smoke/bin/honua-esri-assess" scan filegdb
          --target "$RUNNER_TEMP/wheel-smoke/tests/smoke/fixtures/filegdb/happy/sample.gdb"
          --output /tmp/out.json
      - run: jq -e '.schemaVersion == "v0.1"' /tmp/out.json

  publish:
    runs-on: ubuntu-latest
    needs: smoke-install
    if: ${{ startsWith(github.ref, 'refs/tags/honua-esri-assess-v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: honua-esri-assess-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
