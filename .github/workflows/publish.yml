name: Publish Python

on:
  push:
    tags:
      - "honua-migrate-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Please only: exact existing tag; leave blank for build-only."
        required: false
        default: ""
        type: string
      release_sha:
        description: "Release Please only: exact tag commit; leave blank for build-only."
        required: false
        default: ""
        type: string

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  pre-publish-python:
    name: Python ${{ matrix.python-version }} release gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r requirements/release.txt
      - run: pytest tests --ignore=tests/smoke
      - run: ruff check
      - run: mypy

  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate immutable release context
        if: github.event_name == 'push'
        run: >-
          python scripts/validate_publish_tag.py "${GITHUB_REF_NAME}"
          --require-git-ref
      - name: Validate Release Please dispatch context
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "$GITHUB_REF_NAME"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          python scripts/validate_publish_tag.py "$RELEASE_TAG" --require-git-ref
      - name: Validate build-only dispatch metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test -z "$RELEASE_SHA"
          python scripts/validate_publish_tag.py --allow-untagged

  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Audit runtime dependencies
        run: |
          python scripts/python_runtime_requirements.py > "$RUNNER_TEMP/python-runtime.txt"
          python -m pip_audit --strict --requirement "$RUNNER_TEMP/python-runtime.txt"
      - run: python scripts/check_dep_licenses.py
      - name: Re-run release safety invariants
        run: >-
          pytest -q
          tests/test_handoff_redaction.py
          tests/test_no_telemetry.py
          tests/migrate/test_assessment_read_only.py

  build:
    runs-on: ubuntu-latest
    needs:
      - pre-publish-python
      - validate-tag
      - release-safety
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build wheel and source distribution twice
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/python-dist-a"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/python-dist-b"
      - name: Validate contents and byte-for-byte reproducibility
        run: >-
          python scripts/validate_python_dist.py
          "$RUNNER_TEMP/python-dist-a"
          --compare "$RUNNER_TEMP/python-dist-b"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: ${{ runner.temp }}/python-dist-a/*
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: ${{ runner.temp }}/python-dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare isolated assessment workspace
        run: |
          SMOKE_DIR="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$SMOKE_DIR/tests"
          cp -R tests/smoke "$SMOKE_DIR/tests/smoke"
          cp -R schemas "$SMOKE_DIR/schemas"
      - name: Install and verify wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke/.venv"
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/pip" install \
            --require-hashes -r requirements/release.txt
          wheel="$(echo "$RUNNER_TEMP/python-dist"/*.whl)"
          wheel_hash="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
          printf '%s --hash=sha256:%s\n' "$wheel" "$wheel_hash" \
            > "$RUNNER_TEMP/wheel-requirement.txt"
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/pip" install \
            --require-hashes --no-deps -r "$RUNNER_TEMP/wheel-requirement.txt"
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/pip" check
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/honua-migrate" --help
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/honua-migrate" assess --help
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/honua-esri-assess" --help
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/python" -m honua_migrate assess --help
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/python" -m honua_esri_assess --help
          "$RUNNER_TEMP/wheel-smoke/.venv/bin/python" -c \
            "from importlib.resources import files; assert files('honua_migrate').joinpath('py.typed').is_file()"
      - name: Run installed fixture-backed smoke suite
        working-directory: ${{ runner.temp }}/wheel-smoke
        run: .venv/bin/pytest tests/smoke -q
      - name: Run installed assessment and report workflow
        working-directory: ${{ runner.temp }}/wheel-smoke
        run: |
          .venv/bin/honua-migrate assess scan filegdb \
            --target tests/smoke/fixtures/filegdb/happy/sample.gdb \
            --output EsriFootprint.json --validate
          .venv/bin/honua-migrate assess report \
            --input EsriFootprint.json --output readiness-report.md
          jq -e '.schemaVersion == "v0.2"' EsriFootprint.json
          test -s readiness-report.md
      - name: Install and verify source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" install \
            --require-hashes -r requirements/release.txt
          sdist="$(echo "$RUNNER_TEMP/python-dist"/*.tar.gz)"
          sdist_hash="$(sha256sum "$sdist" | cut -d ' ' -f 1)"
          printf '%s --hash=sha256:%s\n' "$sdist" "$sdist_hash" \
            > "$RUNNER_TEMP/sdist-requirement.txt"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" install \
            --require-hashes --no-build-isolation --no-deps \
            -r "$RUNNER_TEMP/sdist-requirement.txt"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" check
          "$RUNNER_TEMP/sdist-smoke/bin/honua-migrate" assess --help
          "$RUNNER_TEMP/sdist-smoke/bin/honua-esri-assess" --help
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m honua_migrate assess --help
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m honua_esri_assess --help
          "$RUNNER_TEMP/sdist-smoke/bin/python" -c \
            "from importlib.resources import files; assert files('honua_migrate').joinpath('py.typed').is_file()"

  pypi-preflight:
    runs-on: ubuntu-latest
    needs: smoke-install
    if: >-
      ${{
        (github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/honua-migrate-v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      }}
    outputs:
      publish_required: ${{ steps.parity.outputs.publish_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate artifacts and check exact PyPI parity
        id: parity
        run: |
          python scripts/validate_python_dist.py dist
          python scripts/check_pypi_parity.py dist >> "$GITHUB_OUTPUT"

  release-assets:
    runs-on: ubuntu-latest
    needs:
      - smoke-install
      - pypi-preflight
    if: >-
      ${{
        (github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/honua-migrate-v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Revalidate tag and downloaded artifacts
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$RELEASE_TAG" = "$GITHUB_REF_NAME"
            test "$RELEASE_SHA" = "$GITHUB_SHA"
          fi
          python scripts/validate_publish_tag.py "${GITHUB_REF_NAME}" --require-git-ref
          python scripts/validate_python_dist.py dist
      - name: Prepare GitHub release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/release-assets/"
          version="${GITHUB_REF_NAME#honua-migrate-v}"
          sed "s/<version>/$version/g" docs/release-installation.md \
            > "$RUNNER_TEMP/release-assets/honua-migrate-installation.md"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum *.whl *.tar.gz honua-migrate-installation.md > SHA256SUMS
      - name: Attach only absent or byte-identical release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_dir="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing_dir"
          release_json="$(gh release view "$GITHUB_REF_NAME" --json assets,tagName)"
          test "$(jq -r .tagName <<< "$release_json")" = "$GITHUB_REF_NAME"
          for asset in "$RUNNER_TEMP/release-assets/"*; do
            name="$(basename "$asset")"
            count="$(jq --arg name "$name" \
              '[.assets[] | select(.name == $name)] | length' <<< "$release_json")"
            test "$count" -le 1
            if [[ "$count" -eq 1 ]]; then
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$name" --dir "$existing_dir"
              cmp --silent "$asset" "$existing_dir/$name" || {
                echo "Existing release asset $name does not match the build." >&2
                exit 1
              }
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done

  publish:
    runs-on: ubuntu-latest
    needs:
      - pypi-preflight
      - release-assets
    if: >-
      ${{
        needs.pypi-preflight.outputs.publish_required == 'true' &&
        ((github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/honua-migrate-v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      }}
    environment:
      name: pypi-honua-migrate
      url: https://pypi.org/project/honua-migrate/
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-08-20)
        with:
          attestations: true
          packages-dir: dist
