[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "honua-migrate"
version = "0.7.2"
description = "Open-source assessment and migration tooling for Honua."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Honua" }]
keywords = ["arcgis", "esri", "filegdb", "gis", "migration", "readiness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.21,<5",
  "requests>=2.31,<3",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/honua-io/honua-migrate"
Issues = "https://github.com/honua-io/honua-migrate/issues"
Repository = "https://github.com/honua-io/honua-migrate"
Changelog = "https://github.com/honua-io/honua-migrate/blob/trunk/CHANGELOG.md"

[project.scripts]
honua-esri-assess = "honua_esri_assess.cli:main"
honua-migrate = "honua_migrate.cli:main"

[project.optional-dependencies]
filegdb = [
  "pyogrio>=0.12,<0.13",
]
dev = [
  "build>=1.2,<2",
  "hatch>=1.9,<2",
  "httpx>=0.27,<1",
  "mypy>=1.10,<3",
  "packaging>=24,<27",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "responses>=0.25",
  "ruff>=0.5,<1",
]
smoke = [
  "pytest>=8,<10",
  "responses>=0.25",
]

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
# The package ships its own schema copy at
# ``src/honua_esri_assess/schemas/esri-footprint-v0.1.json`` (the resource read
# at runtime via importlib.resources), so it is already included here. A
# ``force-include`` of the repo-root ``schemas/`` copy onto the same wheel path
# is redundant and, under hatchling >=1.27, a hard "second file at the same
# path" error. The repo-root copy remains the canonical human-readable source
# and is shipped in the sdist below; test_schema_packaging keeps the two in sync.
packages = ["src/honua_esri_assess", "src/honua_migrate"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/RELEASE.md",
  "/docs",
  "/pyproject.toml",
  "/requirements",
  "/schemas",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.mypy]
python_version = "3.11"
packages = ["honua_esri_assess", "honua_migrate"]
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
