[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "honua-esri-assess"
version = "0.0.0"
description = "Read-only Esri footprint assessment CLI for Honua migration discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Honua" }]
dependencies = [
  "jsonschema>=4",
  "requests>=2.31",
]

[project.scripts]
honua-esri-assess = "honua_esri_assess.cli:main"

[project.optional-dependencies]
filegdb = [
  "pyogrio>=0.12,<0.13",
]
dev = [
  "pytest>=7",
]
smoke = [
  "jsonschema>=4",
  "pytest>=8",
  "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"honua_esri_assess" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
